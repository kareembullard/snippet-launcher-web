<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snippet Launcher</title>
<meta name="description" content="Instant fuzzy-search launcher for regex patterns, Python snippets, and keyboard shortcuts — type to filter, click to copy.">
<style>
  :root {
    --bg: #f7f8fa;
    --surface: #ffffff;
    --border: #e2e5ea;
    --text: #1a1d23;
    --text-dim: #6b7280;
    --accent: #2563eb;
    --accent-dim: #dbeafe;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --surface: #181b21;
      --border: #2a2e37;
      --text: #e5e7eb;
      --text-dim: #9aa1ad;
      --accent: #60a5fa;
      --accent-dim: #1e3a5f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  header { margin-bottom: 1.5rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  .sub { color: var(--text-dim); font-size: .92rem; margin: 0; }
  .search-box {
    width: 100%; padding: .75rem 1rem; font-size: 1.05rem;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); color: var(--text); outline: none;
  }
  .search-box:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  .meta-row { display: flex; justify-content: space-between; align-items: center; margin: .75rem 0 .5rem; font-size: .8rem; color: var(--text-dim); }
  .filters { display: flex; gap: .4rem; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--border); background: var(--surface); color: var(--text-dim);
    padding: .2rem .65rem; border-radius: 999px; font-size: .78rem; cursor: pointer; user-select: none;
  }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  ul.results { list-style: none; margin: 0; padding: 0; }
  li.entry {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: .7rem .9rem; margin-bottom: .5rem; cursor: pointer; transition: border-color .1s;
  }
  li.entry.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-dim); }
  li.entry .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; }
  li.entry .title { font-weight: 600; font-size: .95rem; }
  li.entry .kind { font-size: .7rem; color: var(--text-dim); border: 1px solid var(--border); border-radius: 4px; padding: .05rem .4rem; white-space: nowrap; }
  li.entry .body { font-family: var(--mono); font-size: .82rem; color: var(--text-dim); margin-top: .3rem; white-space: pre-wrap; word-break: break-word; max-height: 4.5em; overflow: hidden; }
  .empty { text-align: center; color: var(--text-dim); padding: 2.5rem 0; }
  .toast {
    position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(120%);
    background: var(--text); color: var(--bg); padding: .55rem 1.1rem; border-radius: 999px;
    font-size: .85rem; box-shadow: var(--shadow); transition: transform .18s ease-out; pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  footer { margin-top: 2.5rem; text-align: center; font-size: .78rem; color: var(--text-dim); }
  footer a { color: var(--text-dim); }
  kbd { font-family: var(--mono); font-size: .75rem; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: .05rem .35rem; background: var(--bg); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔎 Snippet Launcher</h1>
    <p class="sub">Type to filter regex patterns, Python snippets, and keyboard shortcuts. Click a result (or press <kbd>Enter</kbd>) to copy it.</p>
  </header>

  <input id="search" class="search-box" type="search" placeholder="Search…" autofocus autocomplete="off">

  <div class="meta-row">
    <span id="count"></span>
    <div class="filters" id="filters"></div>
  </div>

  <ul class="results" id="results"></ul>
  <div class="empty" id="empty" style="display:none">No matches.</div>

  <footer>
    Generic public demo — no personal data. Source: <a href="https://github.com/kareembullard/snippet-launcher-web" target="_blank" rel="noopener">snippet-launcher-web</a>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
// ---------------------------------------------------------------------
// Data: generic, publicly-useful reference entries. No personal content.
// ---------------------------------------------------------------------
const ENTRIES = [
  // --- Regex ---
  { kind: "Regex", title: "Email address", body: "^[\\w.+-]+@[\\w-]+\\.[a-zA-Z]{2,}$", tags: "email validate" },
  { kind: "Regex", title: "URL (http/https)", body: "https?:\\/\\/[^\\s]+", tags: "url link web" },
  { kind: "Regex", title: "IPv4 address", body: "\\b(?:\\d{1,3}\\.){3}\\d{1,3}\\b", tags: "ip network" },
  { kind: "Regex", title: "US phone number", body: "\\(?\\d{3}\\)?[-.\\s]?\\d{3}[-.\\s]?\\d{4}", tags: "phone number" },
  { kind: "Regex", title: "Date (YYYY-MM-DD)", body: "\\d{4}-\\d{2}-\\d{2}", tags: "date iso" },
  { kind: "Regex", title: "Hex color code", body: "#(?:[0-9a-fA-F]{3}){1,2}\\b", tags: "color css hex" },
  { kind: "Regex", title: "Digits only", body: "^\\d+$", tags: "number digits" },
  { kind: "Regex", title: "Trim whitespace (both ends)", body: "^\\s+|\\s+$", tags: "whitespace trim" },
  { kind: "Regex", title: "Word boundary", body: "\\bword\\b", tags: "boundary word" },
  { kind: "Regex", title: "Non-greedy match", body: ".*?", tags: "lazy nongreedy" },
  { kind: "Regex", title: "Named capture group", body: "(?<year>\\d{4})-(?<month>\\d{2})-(?<day>\\d{2})", tags: "capture group named" },
  { kind: "Regex", title: "Positive lookahead", body: "foo(?=bar)", tags: "lookahead" },
  { kind: "Regex", title: "Positive lookbehind", body: "(?<=foo)bar", tags: "lookbehind" },
  { kind: "Regex", title: "Slug / kebab-case", body: "^[a-z0-9]+(?:-[a-z0-9]+)*$", tags: "slug kebab url" },
  { kind: "Regex", title: "Strip HTML tags", body: "<[^>]*>", tags: "html strip tags" },

  // --- Python ---
  { kind: "Python", title: "Read CSV into list of dicts", body: "import csv\n\nwith open(\"file.csv\", newline=\"\", encoding=\"utf-8\") as f:\n    rows = list(csv.DictReader(f))", tags: "csv read file" },
  { kind: "Python", title: "Write JSON to file", body: "import json\n\nwith open(\"out.json\", \"w\", encoding=\"utf-8\") as f:\n    json.dump(data, f, indent=2)", tags: "json write file" },
  { kind: "Python", title: "Flatten a nested list", body: "def flatten(nested):\n    return [x for sub in nested for x in sub]", tags: "list flatten" },
  { kind: "Python", title: "Dedupe list, preserve order", body: "def dedupe(items):\n    seen = set()\n    return [x for x in items if not (x in seen or seen.add(x))]", tags: "dedupe unique list" },
  { kind: "Python", title: "Try/except with logging", body: "import logging\n\ntry:\n    risky_call()\nexcept Exception:\n    logging.exception(\"risky_call failed\")", tags: "exception error logging" },
  { kind: "Python", title: "Context manager for a file", body: "with open(\"file.txt\", encoding=\"utf-8\") as f:\n    text = f.read()", tags: "file open context" },
  { kind: "Python", title: "Simple argparse skeleton", body: "import argparse\n\nparser = argparse.ArgumentParser()\nparser.add_argument(\"--name\", required=True)\nargs = parser.parse_args()", tags: "argparse cli" },
  { kind: "Python", title: "List comprehension with filter", body: "evens = [x for x in range(20) if x % 2 == 0]", tags: "comprehension filter list" },
  { kind: "Python", title: "Dataclass definition", body: "from dataclasses import dataclass\n\n@dataclass\nclass Point:\n    x: float\n    y: float", tags: "dataclass class" },
  { kind: "Python", title: "Timestamp string (ISO)", body: "from datetime import datetime\n\ntimestamp = datetime.now().isoformat(timespec=\"seconds\")", tags: "datetime timestamp iso" },
  { kind: "Python", title: "Recursive directory walk", body: "import os\n\nfor root, dirs, files in os.walk(\".\"):\n    for name in files:\n        print(os.path.join(root, name))", tags: "walk directory files" },
  { kind: "Python", title: "Virtual environment (Windows)", body: "python -m venv .venv\n.venv\\Scripts\\Activate.ps1\npip install -r requirements.txt", tags: "venv virtualenv setup" },

  // --- Shortcuts ---
  { kind: "Shortcut", title: "Command palette (VS Code)", body: "Ctrl+Shift+P", tags: "vscode command palette" },
  { kind: "Shortcut", title: "Quick open file (VS Code)", body: "Ctrl+P", tags: "vscode open file" },
  { kind: "Shortcut", title: "Toggle terminal (VS Code)", body: "Ctrl+`", tags: "vscode terminal" },
  { kind: "Shortcut", title: "Toggle line comment", body: "Ctrl+/", tags: "comment code editor" },
  { kind: "Shortcut", title: "New browser tab", body: "Ctrl+T", tags: "browser tab" },
  { kind: "Shortcut", title: "Reopen closed tab", body: "Ctrl+Shift+T", tags: "browser tab reopen" },
  { kind: "Shortcut", title: "Focus address bar", body: "Ctrl+L", tags: "browser address bar" },
  { kind: "Shortcut", title: "Close current tab", body: "Ctrl+W", tags: "browser tab close" },
  { kind: "Shortcut", title: "Switch application", body: "Alt+Tab", tags: "windows switch app" },
  { kind: "Shortcut", title: "Show desktop", body: "Win+D", tags: "windows desktop" },
  { kind: "Shortcut", title: "Lock screen", body: "Win+L", tags: "windows lock" },
  { kind: "Shortcut", title: "Snap window left/right", body: "Win+Left / Win+Right", tags: "windows snap" },
  { kind: "Shortcut", title: "Rename file (Explorer)", body: "F2", tags: "windows explorer rename" },
  { kind: "Shortcut", title: "Multi-cursor: add cursor below", body: "Ctrl+Alt+Down", tags: "vscode multicursor" },
  { kind: "Shortcut", title: "Copy line down (VS Code)", body: "Shift+Alt+Down", tags: "vscode duplicate line" },
  { kind: "Shortcut", title: "Undo / Redo", body: "Ctrl+Z / Ctrl+Y", tags: "undo redo" },
];

const KINDS = ["All", ...new Set(ENTRIES.map(e => e.kind))];

// ---------------------------------------------------------------------
// Search
// ---------------------------------------------------------------------
function score(tokens, entry) {
  const title = entry.title.toLowerCase();
  const body = entry.body.toLowerCase();
  const tags = entry.tags.toLowerCase();
  let total = 0;
  for (const tok of tokens) {
    if (title.startsWith(tok)) total += 120;
    else if (title.includes(tok)) total += 100;
    else if (tags.includes(tok)) total += 90;
    else if (body.includes(tok)) total += 40;
    else return 0;
  }
  return total;
}

function search(query, kindFilter) {
  const q = query.trim().toLowerCase();
  const tokens = q.split(/\s+/).filter(Boolean);
  let pool = ENTRIES;
  if (kindFilter && kindFilter !== "All") pool = pool.filter(e => e.kind === kindFilter);
  if (!tokens.length) return pool;
  return pool
    .map(e => [score(tokens, e), e])
    .filter(([s]) => s > 0)
    .sort((a, b) => b[0] - a[0] || a[1].title.length - b[1].title.length)
    .map(([, e]) => e);
}

// ---------------------------------------------------------------------
// UI
// ---------------------------------------------------------------------
const searchBox = document.getElementById("search");
const resultsEl = document.getElementById("results");
const emptyEl = document.getElementById("empty");
const countEl = document.getElementById("count");
const filtersEl = document.getElementById("filters");
const toastEl = document.getElementById("toast");

let activeKind = "All";
let visible = [];
let activeIndex = 0;

KINDS.forEach(kind => {
  const chip = document.createElement("span");
  chip.className = "chip" + (kind === "All" ? " active" : "");
  chip.textContent = kind;
  chip.addEventListener("click", () => {
    activeKind = kind;
    [...filtersEl.children].forEach(c => c.classList.toggle("active", c.textContent === kind));
    refresh();
  });
  filtersEl.appendChild(chip);
});

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastEl.classList.remove("show"), 1400);
}

async function copyEntry(entry) {
  try {
    await navigator.clipboard.writeText(entry.body);
    showToast("Copied: " + entry.title);
  } catch {
    showToast("Copy failed — select and copy manually");
  }
}

function refresh() {
  visible = search(searchBox.value, activeKind);
  activeIndex = 0;
  resultsEl.innerHTML = "";
  emptyEl.style.display = visible.length ? "none" : "block";
  countEl.textContent = visible.length + " result" + (visible.length === 1 ? "" : "s");

  visible.forEach((entry, i) => {
    const li = document.createElement("li");
    li.className = "entry" + (i === 0 ? " active" : "");
    li.innerHTML = `
      <div class="row1">
        <span class="title"></span>
        <span class="kind"></span>
      </div>
      <div class="body"></div>
    `;
    li.querySelector(".title").textContent = entry.title;
    li.querySelector(".kind").textContent = entry.kind;
    li.querySelector(".body").textContent = entry.body;
    li.addEventListener("click", () => copyEntry(entry));
    li.addEventListener("mouseenter", () => setActive(i));
    resultsEl.appendChild(li);
  });
}

function setActive(i) {
  activeIndex = Math.max(0, Math.min(visible.length - 1, i));
  [...resultsEl.children].forEach((li, idx) => li.classList.toggle("active", idx === activeIndex));
  resultsEl.children[activeIndex]?.scrollIntoView({ block: "nearest" });
}

searchBox.addEventListener("input", refresh);
searchBox.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") { e.preventDefault(); setActive(activeIndex + 1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); setActive(activeIndex - 1); }
  else if (e.key === "Enter") { e.preventDefault(); if (visible[activeIndex]) copyEntry(visible[activeIndex]); }
  else if (e.key === "Escape") { if (searchBox.value) searchBox.value = ""; refresh(); }
});

refresh();
searchBox.focus();
</script>
</body>
</html>
